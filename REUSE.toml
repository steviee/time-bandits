version = 1
SPDX-PackageName = "time-bandits"
SPDX-PackageSupplier = "Time Bandits contributors"
SPDX-PackageDownloadLocation = "https://github.com/steviee/time-bandits"

# Generated or format-constrained files that cannot carry a comment header.
[[annotations]]
path = ["Cargo.lock", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Time Bandits contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Debian packaging formats are strict about their own syntax and cannot carry a
# comment header, so their licensing is declared here instead.
[[annotations]]
path = [
    "packaging/debian/changelog",
    "packaging/debian/control",
    "packaging/debian/source/format",
    "packaging/debian/time-bandits.docs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Time Bandits contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# JSON has no comment syntax, and the KDE tooling reads these files strictly.
[[annotations]]
path = [
    "plasmoid/org.timebandits.screentime/metadata.json",
    "kwin-script/org.timebandits.focus/metadata.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Time Bandits contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Translation catalogues are rewritten wholesale by xgettext and msgmerge,
# which do not preserve a hand-written header.
[[annotations]]
path = ["plasmoid/po/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Time Bandits contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
