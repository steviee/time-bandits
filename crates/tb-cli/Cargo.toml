[package]
name = "tb-cli"
description = "Time Bandits: Kommandozeilen-Verwaltung (tbctl)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jiff = { version = "0.2.35", features = ["serde"] }
serde_json = "1.0.151"
tb-core.workspace = true
tb-daemon = { version = "0.1.0", path = "../tb-daemon" }
tb-proto.workspace = true
toml = "1.1.4"

[[bin]]
name = "tbctl"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.24.1", features = ["v7"] }
