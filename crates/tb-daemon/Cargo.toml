[package]
name = "tb-daemon"
description = "Time Bandits: Systemdienst (root) für Erfassung und Durchsetzung"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2.35", features = ["serde"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tb-core.workspace = true
tb-proto.workspace = true
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync", "io-util"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v7", "serde"] }

[lib]
name = "tb_daemon"
path = "src/lib.rs"

[[bin]]
name = "timebanditsd"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
