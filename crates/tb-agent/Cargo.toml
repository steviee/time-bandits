[package]
name = "tb-agent"
description = "Time Bandits: Sitzungs-Agent für Fokus-, Idle- und Benachrichtigungen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tb-core.workspace = true
tb-proto.workspace = true
tokio = { version = "1.53.1", features = ["rt", "net", "time", "signal", "macros", "sync", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lib]
name = "tb_agent"
path = "src/lib.rs"

[[bin]]
name = "timebandits-agent"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
