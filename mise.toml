#
# Toolchain for Time Bandits. `mise install` sets everything up.

[tools]
rust  = { version = "1.97", components = "rustfmt,clippy", profile = "default" }
node  = "24"
pnpm  = "latest"
just  = "latest"
gh    = "latest"        # repository work, releases, CI logs
# The VM walkthrough's safety guards are shell, and get linted like the rest.
shellcheck = "0.11"

# Developer tooling, as prebuilt binaries rather than a source build.
cargo-binstall = "latest"

[env]
# Build artefacts stay inside the workspace, so nothing leaks into $HOME.
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

[settings]
experimental = true

[tasks.setup]
description = "One-time setup after cloning"
run = [
  "cargo binstall -y cargo-nextest cargo-deny",
  "pnpm --dir web install",
]
