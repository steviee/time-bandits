#
# The /etc side of an installation, created by systemd rather than by a package
# scriptlet — because on an image-based system there is no scriptlet. A system
# extension covers /usr and /opt only, so without this the daemon comes up on
# built-in defaults and /etc/timebandits is empty: no commented configuration
# for an administrator to read, and nowhere obvious for the rules to live.
#
# `C` copies only when the destination does not exist, so an edited daemon.toml
# is never overwritten, on any boot or any upgrade.

d /etc/timebandits 0755 root root -
d /etc/timebandits/policy.d 0755 root root -
C /etc/timebandits/daemon.toml 0644 root root - /usr/share/factory/etc/timebandits/daemon.toml
