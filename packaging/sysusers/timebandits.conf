#
# The two groups the whole permission model rests on.
#
# Created by the package rather than by the administrator, because a typo in a
# group name here does not fail loudly — it produces a child nobody is managing
# and a parent who is locked out with everyone else.
#
#   kids     subject to the rules
#   parents  exempt from them, and allowed to change them
#
# Membership is deliberately not set here. Which humans belong in which group is
# the household's decision, not the package's.

g kids -
g parents -
