name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      # tb-pam links against libpam; without this the whole workspace fails to
      # link, not just that crate.
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libpam0g-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The VM walkthrough's safety guards are shell, so they need their own
      # tests. The check that refuses to run on a machine somebody depends on
      # was wrong the first time it ran, and nothing else would have caught it.
      - run: ./tests/vm/lib_test.sh
      - name: Shell scripts pass shellcheck
        run: shellcheck -S warning tests/vm/*.sh

  pam-integration:
    name: The PAM module against a real PAM stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Unit tests cover the module's decisions; they cannot cover what libpam
      # does with them. This job found two faults the first time it ran — a
      # control word that locked every account out when the module was missing,
      # and a group check applied in one half of enforcement but not the other.
      - run: tests/pam/integration.sh

  pam-module:
    name: PAM module loads and exports its symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libpam0g-dev
      - run: cargo build -p tb-pam --release
      # A PAM module that builds but does not export the pam_sm_* symbols is
      # useless in a way no unit test would notice.
      - name: Check exported symbols
        run: |
          lib=target/release/libpam_timebandits.so
          for sym in pam_sm_authenticate pam_sm_setcred pam_sm_acct_mgmt; do
            nm -D --defined-only "$lib" | grep -q " T $sym$" \
              || { echo "::error::$sym is not exported"; exit 1; }
          done
      # Linking against anything beyond libpam and libc would make the RPM
      # heavier than it needs to be on the atomic distributions we target.
      - name: Check the dependency surface stayed small
        run: |
          unexpected=$(ldd target/release/libpam_timebandits.so \
            | grep -oP '^\s+\K[^ ]+\.so[^ ]*' \
            | grep -vE 'libpam|libc\.|libgcc_s|libaudit|libcap-ng|linux-vdso|ld-linux') || true
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected shared libraries: $unexpected"; exit 1
          fi

  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
